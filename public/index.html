<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Streamer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .search-box { margin-bottom: 30px; }
        input { padding: 10px; width: 60%; max-width: 400px; border: none; border-radius: 4px; }
        button { padding: 10px 20px; background: #ff4757; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 280px; object-fit: cover; border-radius: 6px; }
        #player-wrapper { display: none; margin: 20px auto; max-width: 720px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        video { width: 100%; aspect-ratio: 16/9; background: black; }
        #episode-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        .ep-btn { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    </style>
    <!-- Core HLS Engine Link -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>🌌 Anime Stream Engine</h1>
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Enter anime title...">
        <button onclick="searchAnime()">Search</button>
    </div>

    <!-- Active Video Component Container -->
    <div id="player-wrapper">
        <h2 id="playing-title">Select an Episode</h2>
        <video id="video-player" controls autocomplete="off"></video>
        <div id="episode-list"></div>
    </div>

    <!-- Results Placement Target Layout -->
    <div class="grid" id="catalog-grid"></div>

    <script src="app.js"></script>
</body>
</html>
